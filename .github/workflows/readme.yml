# วางไฟล์นี้ที่ .github/workflows/readme.yml ใน repo winnerkypt/winnerkypt
name: Update README widgets

on:
  schedule:
    - cron: "0 */12 * * *"   # อัปเดตทุก 12 ชม.
  workflow_dispatch:          # กดรันเองได้จากแท็บ Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # การ์ดสถิติหลัก (commits, PRs, issues, stars ...)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.classic.svg
          template: classic
          config_timezone: Asia/Bangkok
          base: header, activity, community, repositories

      # การ์ดภาษาที่ใช้บ่อย (แทน top-langs ของ vercel)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, scss, dockerfile, shell

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
